name: Sync upstream styles

on:
  schedule:
    # 03:17 Asia/Shanghai (UTC+8), away from the busy top of the hour.
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: style-library-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test importer contracts
        run: python3 -m unittest discover -s tests -v
      - name: Synchronize data
        id: import
        continue-on-error: true
        run: python3 scripts/sync.py
      - name: Verify aggregate before committing
        run: python3 scripts/sync.py --check
      - name: Commit only generated changes
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          for path in .vetta sources assets licenses ATTRIBUTION.md; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "Upstream data is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(styles): synchronize upstream catalog'
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Report upstream failures
        if: always() && steps.import.outcome == 'failure'
        run: |
          echo '::error::At least one source failed. Existing snapshots were retained; any successful source changes were committed. Inspect importer warnings.'
          exit 1
